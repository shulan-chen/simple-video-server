global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerting_rules.yml"

scrape_configs:
  - job_name: "video-server-web"
    static_configs:
      # make start 本地运行：使用 host.docker.internal 访问宿主机
      # docker-compose 全容器运行：改为 web-service:8080
      - targets: ["host.docker.internal:8080"]
    metrics_path: /metrics
