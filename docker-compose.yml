# docker-compose.yml - 默认配置（生产环境）
#
# 这是默认配置，使用时会连接外部MySQL和Redis
# 如果你想要本地开发环境（包含MySQL/Redis），请使用：
#   docker-compose -f docker-compose.dev.yml up -d
#
# 当前配置等同于 docker-compose.prod.yml

version: '3.7'

services:
  api-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api
    container_name: video-server-api
    ports:
      - "8000:8000"
    environment:
      - CONFIG_PATH=/app/config/config.json
      - DB_ADDR=139.196.242.169:3306
      - REDIS_ADDR=139.196.242.169:6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - video-network
    restart: unless-stopped

  web-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: web
    container_name: video-server-web
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/config/config.json
      - API_ADDR=http://api-service:8000
      - STREAM_ADDR=http://stream-service:9090
    depends_on:
      - api-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - video-network
    restart: unless-stopped

  stream-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: stream
    container_name: video-server-stream
    ports:
      - "9090:9090"
    environment:
      - CONFIG_PATH=/app/config/config.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health/ready"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - video-network
    restart: unless-stopped

  scheduler-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: scheduler
    container_name: video-server-scheduler
    ports:
      - "8001:8001"
    environment:
      - CONFIG_PATH=/app/config/config.json
      - DB_ADDR=139.196.242.169:3306
      - REDIS_ADDR=139.196.242.169:6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/ready"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - video-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: video-server-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - video-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: video-server-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - video-network
    restart: unless-stopped

networks:
  video-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
